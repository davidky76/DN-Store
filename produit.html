<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit - DN Store</title>
<link rel="stylesheet" href="style.css">
<script src="dn.js"></script>
</head>
<body>
<header>
  <div class="top-header">
    <div class="header-action">
      <a href="produits.html">Boutique</a>
      <div style="display:flex; gap:15px;">
        <a href="wishlist.html" style="text-decoration:none;">🤍 <span id="wishlist-count">0</span></a>
        <a href="panier.html">🛒 <span id="panier-count">0.00</span> - <span id="panier-total">0 $</span></a>
      </div>


      <div class="avis-mini-link" onclick="document.getElementById('avisAll').classList.toggle('open')">
        <span>★★★★★</span> Avis (23) <small style="color:#666;">voir plus ›</small>
      </div>
      
      <div class="avis-all" id="avisAll" style="display:none;">
        <div class="avis-section" onclick="toggleAvis()" id="avisBox">
          <div class="avis-mini">
            <div class="avis-mini-left">
              <b style="font-size:20px;">4.8</b><span style="color:#ffb100;">★★★★★</span><small style="color:#666;">(23 avis)</small>
            </div>
            <span id="avisToggle" style="font-size:13px; font-weight:700;">Voir tous ›</span>
          </div>
        
          <!-- 1 seul avis en preview -->
          <div class="avis-preview">
            <img src="https://i.pravatar.cc/100?img=11" style="width:32px; height:32px; border-radius:50%;">
            <div><b style="font-size:12px;">Patrick M. - Makoka</b><p style="font-size:12px; margin:2px 0; color:#333;">Polo de très bonne qualité, livraison rapide !</p></div>
          </div>
        
          <!-- Tous les avis cachés -->
          <div class="avis-preview">
            <div class="avis-preview"><img src="https://i.pravatar.cc/100?img=11" style="width:32px; height:32px; border-radius:50%;"><div><b>Patrick M.</b> <span style="color:#ffb100;">★★★★★</span><p>Livraison rapide à domicile, merci DN Store !</p></div></div>
            <div class="avis-preview"><img src="https://i.pravatar.cc/100?img=32" style="width:32px; height:32px; border-radius:50%;"><div><b>David K.</b> <span style="color:#ffb100;">★★★★★</span><p>Couleur fidèle aux photos.</p></div></div>
            <div class="avis-preview"><img src="https://i.pravatar.cc/100?img=5" style="width:32px; height:32px; border-radius:50%;"><div><b>Grace L.</b> <span style="color:#ffb100;">★★★★☆</span><p>Très beau polo.</p></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="produit-root"></div>

<script>
const PRODUCTS_DB = {
  "polo-de-marque": { id: "polo-de-marque", nom: "POLO de marque", desc: "Un polo en fil premium", ancien: 12, nouveau: 8, sku: "DN-POLO-001", tailles: "S - M - L - XL", couleurs: [{nom:"Blanc", code:"white"}, {nom:"Noir", code:"black"}, {nom:"Choco", code:"rgb(43,31,31)"}], images: ["imgs/polo-001.jpg","imgs/polo-002.jpg","imgs/polo-003.jpg","imgs/polo-004.jpg"] },
  "polo-nike": { id: "polo-nike", nom: "Polo Nike", desc: "Un polo parfait d'un tissu premium", ancien: 12, nouveau: 8, sku: "DN-POLO-003", tailles: "S - M - L - XL", couleurs: [{nom:"Noir", code:"black"}, {nom:"Beige", code:"beige"}, {nom:"Grise", code:"#777"}], images: ["imgs/polo-lv.jpeg","imgs/chem3.jpg","imgs/polo2-3.jpg","imgs/polo2-4.jpg"] },
  "polo-1977": { id: "polo-1977", nom: "Polo 1977", desc: "Un polo parfait pour vos rendez-vous", ancien: 12, nouveau: 8, sku: "DN-POLO-002", tailles: "S - M - L - XL", couleurs: [{nom:"Noir", code:"black"}, {nom:"Blanc", code:"white"}], images: ["imgs/polo2.jpg","imgs/polo.jpeg","imgs/pol4.jpg","imgs/nos-polo1.jpeg"] },
};

let selectedTaille = null;
let selectedCouleur = null;

function getId(){
   return new URLSearchParams(window.location.search).get('id') || 'polo-de-marque'; 
   return new URLSearchParams(window.location.search).get('id') || 'polo-nike'; 
  }

function render(){
  const id = getId();
  const p = PRODUCTS_DB[id];
  const root = document.getElementById('produit-root');
  if(!p){ root.innerHTML = `<div style="text-align:center; padding:40px;">Produit non trouvé<br><a href="produits.html">Continuer mes achats</a></div>`; return; }
  
  selectedTaille = null; selectedCouleur = null;

  root.innerHTML = `
    <div class="produit-ecom">
      <div>
        <img src="${p.images[0]}" id="mainImg" class="main-photo">
        <button type="button" class="btn-heart" data-wish-id="polo-de-marque" data-nom="Polo de marque" data-prix="8" data-img="imgs/polo1.jpg">
  <svg class="heart-outline" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-4.35-9-8.5A5.5 5.5 0 0 1 12 7a5.5 5.5 0 0 1 9 5.5c-2.5 4.15-9 8.5-9 8.5z"/></svg>
  <svg class="heart-filled" viewBox="0 0 24 24" width="18" height="18" fill="#e63946" style="display:none"><path d="M12 21s-6.5-4.35-9-8.5A5.5 5.5 0 0 1 12 7a5.5 5.5 0 0 1 9 5.5c-2.5 4.15-9 8.5-9 8.5z"/></svg>
</button>
        <div class="thumb-row">
          ${p.images.map((im,i)=>`<img src="${im}" onclick="changePhoto('${im}',this)" class="${i==0?'active':''}">`).join('')}
        </div>
      </div>
      <div>
        <span class="badge-promo">NOUVEAUTÉ</span>
        <h1 style="margin:12px 0 5px; color:#000; font-weight:bold;">${p.nom}</h1>
        <p style="color:#666;">${p.desc}</p>
        <p style="font-size:13px; margin-top:8px;">SKU: ${p.sku}</p>
        <div class="prix-box"><span class="ancien-prix">${p.ancien} $</span><span class="nouveau-prix">${p.nouveau} $</span></div>

        <div class="opt">
          <span>Couleur disponible: <b id="couleur-label" style="color:#111;">Choisis</b></span>
          <div style="margin-top:10px;">
            ${p.couleurs.map((c,idx)=>`<span class="color-dot" ${c.code=='white'?'white-dot':''}" style="background:${c.code};" title="${c.nom}" onclick="selectCouleur('${c.nom}', '${c.code}', this)"></span>`).join('')}
          </div>
          <div id="error-couleur" class="choix-error">Choisis une couleur Mr *</div>
        </div>

        <div class="opt">
          <span>Taille: <b id="taille-label" style="color:#111;">Choisis</b></span>
          <div style="margin-top:10px;">
            ${p.tailles.split('-').map(t=>`<span class="taille-badge" onclick="selectTaille('${t.trim()}', this)">${t.trim()}</span>`).join('')}
          </div>
          <div id="error-taille" class="choix-error">Choisis une taille Mr *</div>
        </div>

        <button class="btn-add" id="btnAdd" onclick="addPanier('${id}')">Ajouter au panier - ${p.nouveau} $</button>
        <a href="javascript:void(0)" onclick="retourAchats()" class="btn-continuer">← Continuer mes achats</a>

        <div style="margin-top:20px; background:#f9f9f9; padding:12px; border-radius:12px; font-size:13px; color:#555;">
          ✅ Livraison partout en RDC<br>✅ Paiement à la livraison
        </div>
      </div>
    </div>
  `;
  refreshUI();
}

function changePhoto(src, el){
  document.getElementById('mainImg').src = src;
  document.querySelectorAll('.thumb-row img').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
}

function selectCouleur(nom, code, el){
  selectedCouleur = {nom, code};
  document.getElementById('couleur-label').textContent = nom;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('error-couleur').style.display='none';
}

function selectTaille(taille, el){
  selectedTaille = taille;
  document.getElementById('taille-label').textContent = taille;
  document.querySelectorAll('.taille-badge').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('error-taille').style.display='none';
}

function addPanier(id){
  if(!selectedCouleur){
    document.getElementById('error-couleur').style.display='block';
    return;
  }
  if(!selectedTaille){
    document.getElementById('error-taille').style.display='block';
    return;
  }

  const p = PRODUCTS_DB[id];
  let panier = JSON.parse(localStorage.getItem('dn_panier')||"[]");
  
  // On crée un ID unique par variante (ex: polo-de-marque_M_Blanc)
  let variantId = `${id}_${selectedTaille}_${selectedCouleur.nom}`;
  
  let ex = panier.find(x=>x.variantId===variantId);
  if(ex) ex.qte++;
  else {
    panier.push({
      id: id,
      variantId: variantId,
      nom: p.nom,
      prix: p.nouveau,
      sku: p.sku,
      img: p.images[0],
      image: p.images[0],
      qte: 1,
      taille: selectedTaille,
      couleur: selectedCouleur.nom,
      couleurCode: selectedCouleur.code
    });
  }

  localStorage.setItem('dn_panier', JSON.stringify(panier));
  localStorage.setItem('panier', JSON.stringify(panier)); // pour compatibilité avec commande.html
  alert(`${p.nom} - ${selectedCouleur.nom} / ${selectedTaille} ajouté !`);
}

function retourAchats(){ window.location.href = 'produits.html'; }
render();

document.querySelector('.avis-mini-link').addEventListener('click', function(){
  let all = document.getElementById('avisAll');
  all.style.display = all.style.display==='none' ? 'block' : 'none';
});
</script>
</body>
</html>
